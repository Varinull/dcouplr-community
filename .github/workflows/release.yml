name: Release Community Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. 1.0.1)'
        required: true
        default: '1.0.1'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve Version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ github.event.inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          VER="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VER}" >> $GITHUB_OUTPUT

      - name: Build Community Packages
        run: |
          mkdir -p dist
          VER="${{ steps.vars.outputs.version }}"

          # Standalone Installers
          cp install.sh dist/install.sh
          cp install.ps1 dist/install.ps1

          # Source & Documentation Archives
          tar -czf "dist/dcouplr-community-v${VER}.tar.gz" LICENSE README.md docs install.sh install.ps1
          zip -r "dist/dcouplr-community-v${VER}.zip" LICENSE README.md docs install.sh install.ps1

          # Unix Platform Bundles
          for plat in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            DIR="pkg_${plat}/dcouplr-${VER}-${plat}"
            mkdir -p "$DIR"
            cp LICENSE README.md install.sh "$DIR/"
            cp -r docs "$DIR/"
            tar -czf "dist/dcouplr-${VER}-${plat}.tar.gz" -C "pkg_${plat}" "dcouplr-${VER}-${plat}"
          done

          # Windows Platform Bundle
          WIN_DIR="pkg_win/dcouplr-${VER}-windows-amd64"
          mkdir -p "$WIN_DIR"
          cp LICENSE README.md install.ps1 "$WIN_DIR/"
          cp -r docs "$WIN_DIR/"
          (cd pkg_win && zip -r "../dist/dcouplr-${VER}-windows-amd64.zip" "dcouplr-${VER}-windows-amd64")

          # Generate Cryptographic SHA-256 Checksums
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "<dcouplr/> Community Core ${{ steps.vars.outputs.tag }}"
          files: |
            dist/*
          generate_release_notes: true
